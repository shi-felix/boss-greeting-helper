<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>打招呼助手</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div class="title-row">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <h1>打招呼助手</h1>
      <button id="goSettings" class="link-btn" title="打开设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="block">
      <div class="block-label">
        <span>岗位JD</span>
        <div class="label-actions">
          <button id="pasteJd" class="link-btn sm" title="清空并粘贴剪贴板内容">粘贴</button>
          <button id="reRead" class="link-btn sm">从当前页读取</button>
        </div>
      </div>
      <textarea id="jdText" placeholder="点击右上「从当前页读取」自动获取，或手动粘贴JD..."></textarea>
    </div>

    <!-- 生成按钮放JD下方，方便操作 -->
    <div class="gen-actions">
      <button id="genBtn" class="btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        生成打招呼语
      </button>
      <button id="regenBtn" class="btn ghost" style="display:none">换一批</button>
    </div>

    <div id="errorBox" class="error-box"></div>

    <div class="block">
      <div class="block-label"><span>生成的打招呼语</span></div>
      <div id="greetList" class="greet-list">
        <div class="empty">填写JD后点击上方「生成打招呼语」</div>
      </div>
    </div>
  </main>

  <footer>
    <span id="statusTip" class="status-tip"></span>
  </footer>

  <script src="panel.js"></script>
</body>
</html>
